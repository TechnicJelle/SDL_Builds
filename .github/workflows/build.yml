name: Build

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdl-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Get Latest Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDL_TAG=$(curl --no-progress-meter --write-out "%{redirect_url}" https://github.com/libsdl-org/SDL/releases/latest | sed -E "s/.*\/releases\/tag\/([^#]*)#?.*/\1/")
          SDL_TAG_LOCAL=$(cat libs/SDL3/version.txt)
          if [[ "$SDL_TAG" == "$SDL_TAG_LOCAL" ]]; then
            gh run cancel
          else
            echo "tag=$SDL_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: sdl-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            so-name: libSDL3.so
            compiler: gcc
            generator: Ninja
          - os: windows-latest
            rid: win-x64
            so-name: SDL3.dll
            compiler: cl
            generator: "Visual Studio 18 2026"
    defaults:
      run:
        shell: bash
    env:
      SDL_TAG: ${{ needs.sdl-version.outputs.tag }}
    steps:
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: >
          sudo apt-get install build-essential git make
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Prepare for cloning
        run: mkdir -p clones

      - name: Get SDL source
        working-directory: clones
        run: git clone --depth 1 --branch $SDL_TAG https://github.com/libsdl-org/SDL.git

      - name: CMake Configure
        working-directory: clones/SDL
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF
          -DSDL_TEST_LIBRARY=OFF
          -DSDL_TESTS=OFF
          -DSDL_DISABLE_INSTALL=ON
          -DSDL_DISABLE_INSTALL_DOCS=ON
          -DSDL_INSTALL_TESTS=OFF

      - name: CMake Build
        working-directory: clones/SDL
        run: |
          cmake --build build --config Release --parallel
          cd build
          [ -d "Release" ] && cp Release/* . || true

      - name: Prepare for upload
        run: |
          mkdir -p upload
          cp "clones/SDL/build/${{ matrix.so-name }}" "upload/${{ matrix.rid }},${{ matrix.so-name }}"

      - name: Upload built Dynamic Library file
        uses: actions/upload-artifact@v7
        with:
          path: upload/*
          archive: false

  push:
    runs-on: ubuntu-latest
    needs: [ sdl-version, build ]
    env:
      SDL_TAG: ${{ needs.sdl-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download built Dynamic Library files
        uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true

      - name: Put Dynamic Library files into the correct spots
        working-directory: builds
        run: |
          for FILE in *; do
            PARTS=(${FILE//,/ })
            mkdir -p ../libs/SDL3/${PARTS[0]}
            cp "$FILE" ../libs/SDL3/${PARTS[0]}/${PARTS[1]}
          done
          git add ../libs

      - name: Setup git credentials for the GitHub Actions Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mark success
        run: |
          echo "$SDL_TAG" > libs/SDL3/version.txt
          git add libs/SDL3/version.txt

      - name: Push update
        run: |
          [[ $(git diff-index HEAD --) ]] || { echo "No updates found. No push necessary." >> $GITHUB_STEP_SUMMARY; exit 0; }
          git commit -m "Updated SDL to $SDL_TAG"
          git pull --rebase
          git push
